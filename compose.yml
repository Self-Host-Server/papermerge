services:
  webapp:
    # Built from upstream docker.io/papermerge/papermerge:3.5.3 with two
    # core_app patches applied -- see docker/webapp/Dockerfile and
    # docker/webapp/patches/*.py for what changed and why (fixes a crash on
    # OIDC tokens carrying a `groups` claim, and adds group/role-to-scope
    # mapping + a default-role fallback for first-time SSO logins).
    build:
      context: ./docker/webapp
    image: papermerge-webapp:3.5.3-oidc-roles
    restart: unless-stopped
    environment:
      PAPERMERGE__SECURITY__SECRET_KEY: ${PAPERMERGE_SECRET_KEY}
      PAPERMERGE__AUTH__USERNAME: ${PAPERMERGE_ADMIN_USERNAME}
      PAPERMERGE__AUTH__PASSWORD: ${PAPERMERGE_ADMIN_PASSWORD}
      PAPERMERGE__DATABASE__URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAPERMERGE__SEARCH__URL: solr://solr:8983/pmg
      PAPERMERGE__MAIN__MEDIA_ROOT: /var/media/pmg
      PAPERMERGE__REDIS__URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PAPERMERGE__OCR__LANG_CODES: "eng"
      PAPERMERGE__OCR__DEFAULT_LANG_CODE: "eng"
      # OIDC (Authentik) -- optional, only takes effect once all five are set.
      # auth_server_app runs inside this same image (via supervisord) and reads
      # these directly; there is no separate compose service for it.
      # Values must come from the Authentik OAuth2/OIDC Provider + Application
      # object -- these are real endpoint URLs (token/userinfo/introspect), not
      # an issuer URL, since papermerge does not do OIDC discovery.
      # Authorized redirect URI to register in Authentik must be exactly:
      #   <http|https>://<your domain>/oidc/callback
      PAPERMERGE__AUTH__OIDC_CLIENT_ID: ${PAPERMERGE_OIDC_CLIENT_ID:-}
      PAPERMERGE__AUTH__OIDC_CLIENT_SECRET: ${PAPERMERGE_OIDC_CLIENT_SECRET:-}
      PAPERMERGE__AUTH__OIDC_ACCESS_TOKEN_URL: ${PAPERMERGE_OIDC_ACCESS_TOKEN_URL:-}
      PAPERMERGE__AUTH__OIDC_USER_INFO_URL: ${PAPERMERGE_OIDC_USER_INFO_URL:-}
      PAPERMERGE__AUTH__OIDC_INTROSPECT_URL: ${PAPERMERGE_OIDC_INTROSPECT_URL:-}
      # Name of an existing Papermerge Role to grant as a baseline to any
      # SSO user who matched no group/role claim (see patches/auth_init.py).
      # Leave blank to keep the upstream zero-permission-by-default behavior.
      PAPERMERGE__AUTH__OIDC_DEFAULT_ROLE: ${PAPERMERGE_OIDC_DEFAULT_ROLE:-}
    volumes:
      - media_root:/var/media/pmg
    ports:
      - "12000:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy

  ocr_worker:
    image: docker.io/papermerge/ocrworker:0.3.1
    restart: unless-stopped
    command: worker
    environment:
      PAPERMERGE__DATABASE__URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAPERMERGE__REDIS__URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PAPERMERGE__MAIN__MEDIA_ROOT: /var/media/pmg
      OCR_WORKER_ARGS: "-Q ocr -c 2"
    volumes:
      - media_root:/var/media/pmg
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  i3worker:
    image: docker.io/papermerge/i3worker:0.3
    restart: unless-stopped
    command: worker
    environment:
      PAPERMERGE__DATABASE__URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAPERMERGE__SEARCH__URL: solr://solr:8983/pmg
      PAPERMERGE__REDIS__URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      I3_WORKER_ARGS: "-Q i3 -c 2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:16.1
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: docker.io/library/redis:7.2
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  solr:
    image: docker.io/library/solr:9.7
    restart: unless-stopped
    volumes:
      - solr_data:/var/solr
    command:
      - solr-precreate
      - pmg
    healthcheck:
      # `solr healthcheck -c pmg` assumes SolrCloud and times out waiting on
      # ZooKeeper (verified against solr:9.7 -- this stack runs standalone
      # Solr, no ZK). Use the admin cores API instead.
      test:
        [
          "CMD-SHELL",
          "curl -sf 'http://localhost:8983/solr/admin/cores?action=STATUS' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pg_data:
  media_root:
  solr_data:
