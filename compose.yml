services:
  webapp:
    image: docker.io/papermerge/papermerge:3.5.3
    restart: unless-stopped
    environment:
      PAPERMERGE__SECURITY__SECRET_KEY: ${PAPERMERGE_SECRET_KEY}
      PAPERMERGE__AUTH__USERNAME: ${PAPERMERGE_ADMIN_USERNAME}
      PAPERMERGE__AUTH__PASSWORD: ${PAPERMERGE_ADMIN_PASSWORD}
      PAPERMERGE__DATABASE__URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAPERMERGE__SEARCH__URL: solr://solr:8983/pmg
      PAPERMERGE__MAIN__MEDIA_ROOT: /var/media/pmg
      PAPERMERGE__REDIS__URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PAPERMERGE__OCR__LANG_CODES: "eng"
      PAPERMERGE__OCR__DEFAULT_LANG_CODE: "eng"
    volumes:
      - media_root:/var/media/pmg
    ports:
      - "12000:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy

  ocr_worker:
    image: docker.io/papermerge/ocrworker:0.3.1
    restart: unless-stopped
    command: worker
    environment:
      PAPERMERGE__DATABASE__URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAPERMERGE__REDIS__URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PAPERMERGE__MAIN__MEDIA_ROOT: /var/media/pmg
      OCR_WORKER_ARGS: "-Q ocr -c 2"
    volumes:
      - media_root:/var/media/pmg
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  i3worker:
    image: docker.io/papermerge/i3worker:0.3
    restart: unless-stopped
    command: worker
    environment:
      PAPERMERGE__DATABASE__URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAPERMERGE__SEARCH__URL: solr://solr:8983/pmg
      PAPERMERGE__REDIS__URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      I3_WORKER_ARGS: "-Q i3 -c 2"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      solr:
        condition: service_healthy

  db:
    image: docker.io/library/postgres:16.1
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: docker.io/library/redis:7.2
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  solr:
    image: docker.io/library/solr:9.7
    restart: unless-stopped
    volumes:
      - solr_data:/var/solr
    command:
      - solr-precreate
      - pmg
    healthcheck:
      # `solr healthcheck -c pmg` assumes SolrCloud and times out waiting on
      # ZooKeeper (verified against solr:9.7 -- this stack runs standalone
      # Solr, no ZK). Use the admin cores API instead.
      test:
        [
          "CMD-SHELL",
          "curl -sf 'http://localhost:8983/solr/admin/cores?action=STATUS' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  pg_data:
  media_root:
  solr_data:
